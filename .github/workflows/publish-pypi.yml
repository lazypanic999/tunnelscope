name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Expected tag {expected}')
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the actual source distribution before publishing
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import tempfile

          archives = list(Path('dist').glob('*.tar.gz'))
          if len(archives) != 1:
              raise SystemExit('Expected one source distribution')
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              with tarfile.open(archives[0]) as archive:
                  archive.extractall(root, filter='data')
              sources = list(root.iterdir())
              if len(sources) != 1 or not sources[0].is_dir():
                  raise SystemExit('Expected one source root')
              environment = os.environ.copy()
              for name in ('PYTHONPATH', 'TUNNELSCOPE_RUN_NETNS_TESTS',
                           'TUNNELSCOPE_RUN_OPENVPN_TESTS'):
                  environment.pop(name, None)
              subprocess.run([sys.executable, '-m', 'unittest', 'discover',
                              '-s', 'tests', '-q'], cwd=sources[0],
                             env=environment, check=True, timeout=180)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
