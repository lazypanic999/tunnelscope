name: Python delivery checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Check installed command
        run: tunnelscope --help
      - name: Check installed report workflows without checkout imports
        run: python -I scripts/check_installed.py
      - run: python -m unittest discover -s tests -v
      - name: Validate isolated Linux MTU labs
        if: runner.os == 'Linux'
        run: |
          mkdir -p "${{ runner.temp }}/tunnelscope-labs"
          sudo env TUNNELSCOPE_RUN_NETNS_TESTS=1 \
          TUNNELSCOPE_LAB_OUTPUT_DIR="${{ runner.temp }}/tunnelscope-labs" \
          "$(command -v python)" -m unittest discover -s tests -v
      - name: Record lab artifact provenance
        if: always() && runner.os == 'Linux'
        env:
          TUNNELSCOPE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/write_lab_manifest.py --directory "${{ runner.temp }}/tunnelscope-labs"
      - name: Keep lab output
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: lab-output-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/tunnelscope-labs/
          if-no-files-found: ignore
          retention-days: 90

  delivery-checks:
    name: Delivery checks
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all delivery matrix jobs succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
