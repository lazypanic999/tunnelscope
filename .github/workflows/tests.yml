name: Python delivery checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Check installed command
        run: tunnelscope --help
      - run: python -m unittest discover -s tests -v
      - name: Validate isolated Linux MTU labs
        if: runner.os == 'Linux'
        run: >-
          sudo env TUNNELSCOPE_RUN_NETNS_TESTS=1
          TUNNELSCOPE_LAB_OUTPUT_DIR="${{ runner.temp }}/tunnelscope-labs"
          "$(command -v python)" -m unittest discover -s tests -v
      - name: Keep lab output
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: lab-output-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/tunnelscope-labs/
          if-no-files-found: ignore
          retention-days: 90

  delivery-checks:
    name: Delivery checks
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all delivery matrix jobs succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
